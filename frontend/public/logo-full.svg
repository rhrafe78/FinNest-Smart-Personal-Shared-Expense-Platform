<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Brand Icon Badge -->
  <g transform="translate(10, 10)">
    <rect width="60" height="60" rx="16" fill="url(#grad)" filter="url(#shadow)"/>
    
    <!-- Stylized Nest Curves -->
    <path d="M15 36C15 44.2843 21.7157 51 30 51C38.2843 51 45 44.2843 45 36C45 34.2 43.8 33 42 33C40.2 33 39.5 34.2 39.5 36C39.5 41.2467 35.2467 45.5 30 45.5C24.7533 45.5 20.5 41.2467 20.5 36C20.5 34.2 19.8 33 18 33C16.2 33 15 34.2 15 36Z" fill="#C7D2FE"/>
    <path d="M20 30C20 35.5228 24.4772 40 30 40C35.5228 40 40 35.5228 40 30C40 28.5 38.8 27.5 37.3 27.5C35.8 27.5 35 28.5 35 30C35 32.7614 32.7614 35 30 35C27.2386 35 25 32.7614 25 30C25 28.5 24.2 27.5 22.7 27.5C21.2 27.5 20 28.5 20 30Z" fill="#E0E7FF"/>
    
    <!-- Glowing Emerald Wealth Coin -->
    <circle cx="30" cy="22" r="9" fill="#10B981"/>
